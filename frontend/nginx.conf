server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin from the browser's point of view — proxied to the backend
    # container over the internal Docker network, so no CORS config needed.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
